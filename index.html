<style>
:root{
  --white:#FFFFFF;--paper:#F4F7FC;--navy:#0E2140;--ink:#1B2E4D;
  --blue:#1746C8;--blue-d:#0F3199;--sky:#5B9BFF;--pale:#E8F0FF;
  --line:#D8E2F1;--mute:#6B7E9B;
  --num:"Oswald",sans-serif;--jp:"Zen Kaku Gothic New",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);font-weight:500;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}

.topbar{height:8px;background:linear-gradient(90deg,var(--blue) 0 55%,var(--sky) 55% 80%,var(--pale) 80% 100%)}
.wrap{max-width:880px;margin:0 auto;padding:26px 20px 72px}
.masthead{margin:2px 0 24px}
.masthead h1{font-size:clamp(25px,6.2vw,37px);font-weight:900;letter-spacing:-.01em;margin:0;color:var(--navy);line-height:1.25}

.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px 18px;margin-bottom:18px}
.panel h2{font-size:16px;font-weight:900;margin:0 0 3px;color:var(--navy)}
.panel .note{margin:0 0 14px;font-size:13px;color:var(--mute)}

input[type=text]{width:100%;background:var(--white);border:1.5px solid var(--line);border-radius:8px;
  color:var(--navy);font-family:var(--jp);font-weight:700;font-size:19px;padding:13px 14px}
input[type=text]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,70,200,.14)}

.opts{display:grid;gap:9px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:13px 10px;text-align:center}
.opt b{display:block;font-size:15px;font-weight:900;color:var(--navy)}
.opt span{font-size:11.5px;color:var(--mute)}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--pale)}
.opt[aria-pressed=true] b{color:var(--blue)}
.gap{height:18px}

.picker{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.picker-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px;font-size:12.5px;color:var(--mute)}
.picker-bar button{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:6px;max-height:320px;overflow:auto;padding:2px}
.chip{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:12.5px;text-align:left;line-height:1.35;display:flex;gap:6px;align-items:center}
.chip .g{font-family:var(--num);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mute)}
.chip[aria-pressed=true]{border-color:var(--blue);background:var(--pale);color:var(--blue-d);font-weight:700}
.chip[aria-pressed=true] .g{border-color:var(--sky);color:var(--blue)}

.summary{margin:16px 0 0;font-size:13px;color:var(--mute);text-align:center}
.summary b{font-family:var(--num);font-size:17px;color:var(--navy);margin:0 3px}
.go{width:100%;margin-top:12px;background:var(--blue);border:none;border-radius:8px;color:#fff;font-weight:900;font-size:17px;letter-spacing:.06em;padding:16px}
.go:hover{background:var(--blue-d)}
.go:disabled{background:#BCC8DB;cursor:not-allowed}

.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s ease}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute);margin:8px 0 22px}
.meta b{font-family:var(--num);font-size:16px;color:var(--navy)}
.q{text-align:center;font-size:clamp(16px,4.4vw,21px);font-weight:900;color:var(--navy);margin:0 0 16px}
.ring{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.side{display:flex;flex-direction:column;gap:6px}
.card{width:100%;background:var(--white);border:1.5px solid var(--line);border-radius:12px;
  padding:26px 18px 20px;text-align:center;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:132px;
  transition:border-color .12s,background .12s,transform .1s}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--sky)}
.card .tag{position:absolute;top:11px;left:14px;font-size:11px;font-weight:900;color:var(--blue);background:var(--pale);border-radius:4px;padding:1px 7px}
.card .nm{font-weight:900;color:var(--navy);line-height:1.2}
.card .mem{font-size:12px;color:var(--mute);min-height:1.4em}
.card:hover{border-color:var(--blue)}
.card:active{transform:scale(.99)}
.card:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.skip{align-self:center;background:none;border:none;color:#93A4BE;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
.skip:hover{color:var(--blue)}
.vs{text-align:center;font-family:var(--num);font-size:15px;color:var(--mute);letter-spacing:.14em;padding:4px 0}
.tie{display:block;margin:18px auto 0;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:11px 26px;font-size:14px;color:var(--ink);font-weight:700}
.tie:hover{border-color:var(--sky);color:var(--blue)}
.subacts{display:flex;justify-content:center;gap:22px;margin-top:14px;font-size:13px}
.subacts button{background:none;border:none;color:var(--mute);text-decoration:underline;text-underline-offset:3px;padding:6px}
.keyhint{text-align:center;font-size:11px;color:#94A3BA;margin-top:18px}
@media(min-width:640px){
  .ring{grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
  .card{min-height:190px}
  .vs{padding:0}
}

.rank{list-style:none;margin:0;padding:0;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rank li{display:flex;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:none}
.rank li.t1{background:var(--pale)}
.rank .no{font-family:var(--num);font-weight:600;font-size:22px;min-width:46px;text-align:right;color:#93A4BE;line-height:1}
.rank li.t1 .no{color:var(--blue);font-size:30px}
.rank li.t2 .no,.rank li.t3 .no{color:var(--sky)}
.rank .nm{font-weight:900;color:var(--navy);font-size:16px}
.rank li.t1 .nm{font-size:20px}
.rank .mb{font-size:11.5px;color:var(--mute);margin-left:7px;font-weight:400}
.rank li.unk{background:#FAFCFF}
.rank li.unk .no,.rank li.unk .nm{color:#9BABC4}
.segs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.segs button{background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:6px 15px;font-size:13px}
.segs button[aria-pressed=true]{border-color:var(--blue);color:var(--blue);background:var(--pale);font-weight:700}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:16px}
.acts button{background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:14px;font-size:14px;font-weight:700;color:var(--ink)}
.acts button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.acts button.ghost{border-color:var(--blue);color:var(--blue)}
.xnote{margin:12px 0 0;font-size:12px;color:var(--mute);text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(14,33,64,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal .box{background:#fff;border-radius:12px;padding:22px 20px 18px;max-width:340px;width:100%;box-shadow:0 18px 40px rgba(14,33,64,.25)}
.modal p{margin:0 0 18px;font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.6}
.mbtns{display:flex;gap:9px}
.mbtns button{flex:1;border-radius:8px;padding:11px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.mbtns button.yes{background:var(--blue);border-color:var(--blue);color:#fff}
footer{color:#8494AC;font-size:11.5px;line-height:1.75;margin-top:28px}
footer a{color:var(--blue)}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="topbar"></div>
<div class="wrap">

  <div class="masthead"><h1>マンゲキランキングメーカー</h1></div>

  <!-- SETUP -->
  <section id="setup">
    <div class="panel">
      <h2>ランキング名</h2>
      <p class="note">タイトルは後からも変更可能です。</p>
      <input id="title" type="text" maxlength="30" placeholder="好きな劇場所属芸人ランキング" value="好きな劇場所属芸人ランキング">
    </div>

    <div class="panel">
      <h2>劇場を選択</h2>
      <div class="opts two" id="theaters"></div>

      <div class="gap"></div>
      <h2>メンバーを選択</h2>
      <div class="opts three" id="groups"></div>

      <div class="gap"></div>
      <h2>掲載対象</h2>
      <div class="opts two" id="entries"></div>

      <div class="picker hidden" id="picker">
        <div class="picker-bar">
          <span id="pickCount">0組を選択中</span>
          <button type="button" id="pickAll">全部選ぶ</button>
          <button type="button" id="pickNone">選択を外す</button>
        </div>
        <div class="grid" id="pickGrid"></div>
      </div>

      <p class="summary" id="summary"></p>
      <button class="go" id="start">はじめる</button>
    </div>

  </section>

  <!-- BATTLE -->
  <section id="battle" class="hidden">
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="meta"><span><b id="progText">1</b> 回目</span><span>残り 約<b id="leftText">0</b> 分</span></div>
    <p class="q" id="qText">どっちが好き？</p>
    <div class="ring">
      <div class="side">
        <button class="card" id="cardA"><span class="tag" id="tagA"></span><span class="nm" id="nameA"></span><span class="mem" id="memA"></span></button>
        <button type="button" class="skip" id="skipA">分からない</button>
      </div>
      <div class="vs">VS</div>
      <div class="side">
        <button class="card" id="cardB"><span class="tag" id="tagB"></span><span class="nm" id="nameB"></span><span class="mem" id="memB"></span></button>
        <button type="button" class="skip" id="skipB">分からない</button>
      </div>
    </div>
    <button class="tie" id="tieBtn">どちらも同じくらい</button>
    <div class="subacts">
      <button type="button" id="undo">ひとつ戻る</button>
      <button type="button" id="quit">最初からやり直す</button>
    </div>
    <p class="keyhint">キーボード：↑↓ または ←→ で選択／スペースで引き分け／BackSpaceで戻る</p>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="panel">
      <h2>タイトル</h2>
      <input id="title2" type="text" maxlength="30">
      <div class="segs" id="depth"></div>
    </div>

    <ol class="rank" id="rankList"></ol>

    <div class="acts">
      <button class="primary" id="savePng">画像を保存する</button>
      <button class="ghost" id="shareX">Xに投稿する</button>
      <button id="copyTxt">文章をコピー</button>
      <button id="again">もう一度つくる</button>
    </div>

    <p class="xnote">Xに画像を投稿したい場合は保存して添付してください。</p>
  </section>

  <footer>
    出演者データは
    <a href="https://shibuya-manzaigekijyo.yoshimoto.co.jp/profile/" target="_blank" rel="noopener">渋谷よしもと漫才劇場 所属芸人一覧</a>と
    <a href="https://manzaigekijyo.yoshimoto.co.jp/profile/" target="_blank" rel="noopener">よしもと漫才劇場（大阪）所属芸人一覧</a>から。<br>
    非公式ファンサイトです。権利は各権利者に帰属します。<br>
    制作者：ふかせ（<a href="https://x.com/F6rPd" target="_blank" rel="noopener">@F6rPd</a>）
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div class="box">
  <p id="modalMsg"></p>
  <div class="mbtns"><button type="button" id="modalNo">キャンセル</button><button type="button" class="yes" id="modalYes">OK</button></div>
</div></div>

/* ===== ソート機構 ===== */
let S=null,history=[],done=0,manual=0,rosterIds=[],usedLabel="",usedTheater="",hiddenSet=new Set();
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function advance(s){
  while(true){
    if(s.cur){
      const c=s.cur;
      if(c.i<c.L.length&&c.j<c.R.length)return{done:false,a:c.L[c.i][0],b:c.R[c.j][0]};
      while(c.i<c.L.length)c.out.push(c.L[c.i++]);
      while(c.j<c.R.length)c.out.push(c.R[c.j++]);
      s.next.push(c.out);s.cur=null;continue;
    }
    if(s.pending.length>=2){s.cur={L:s.pending.shift(),R:s.pending.shift(),i:0,j:0,out:[]};continue}
    if(s.pending.length===1)s.next.push(s.pending.shift());
    if(s.next.length<=1)return{done:true,result:s.next[0]||[]};
    s.pending=s.next;s.next=[];
  }
}
function apply(ch){
  const c=S.cur;if(!c)return;
  if(ch==="a")c.out.push(c.L[c.i++]);
  else if(ch==="b")c.out.push(c.R[c.j++]);
  else{c.out.push(c.L[c.i].concat(c.R[c.j]));c.i++;c.j++}
  done++;
}
function snapshot(){history.push({s:clone(S),done,manual,hid:[...hiddenSet]})}
function answer(ch){if(!S||!S.cur)return;snapshot();manual++;apply(ch);render()}
function hideAct(side){
  if(!S||!S.cur)return;
  const r=advance(S);if(r.done)return;
  const id=side==="a"?r.a:r.b;
  snapshot();manual++;hiddenSet.add(id);apply(side==="a"?"b":"a");render();
}
function begin(){
  const ids=chosen();
  const gl=group==="all"?"全メンバー":GNAME[group]+"メンバー";
  usedLabel=entry==="all"?`${gl}${ids.length}組`:`${gl}から${ids.length}組`;
  usedTheater=THEATERS[theater].name;
  rosterIds=shuffle(ids.slice());
  S={pending:rosterIds.map(i=>[[i]]),next:[],cur:null};
  history=[];done=0;manual=0;hiddenSet=new Set();
  const t=$("#title").value.trim();
  $("#qText").textContent=t?`「${t}」ならどっち？`:"どっちが好き？";
  $("#setup").classList.add("hidden");$("#result").classList.add("hidden");
  $("#battle").classList.remove("hidden");
  window.scrollTo(0,0);render();
}
function fitName(el){
  const w=el.parentElement.clientWidth-40;
  const len=Math.max(1,el.textContent.length);
  el.style.fontSize=Math.max(15,Math.min(34,Math.floor(w/len*1.08)))+"px";
}
function render(){
  let guard=0;
  while(true){
    const r=advance(S);
    if(r.done){showResult(r.result);return}
    const ah=hiddenSet.has(r.a),bh=hiddenSet.has(r.b);
    if((ah||bh)&&guard++<20000){apply(ah&&bh?"t":(ah?"b":"a"));continue}
    const A=ACTS[r.a],B=ACTS[r.b];
    $("#nameA").textContent=A.n;$("#memA").textContent=A.m;$("#tagA").textContent=GNAME[A.g];
    $("#nameB").textContent=B.n;$("#memB").textContent=B.m;$("#tagB").textContent=GNAME[B.g];
    fitName($("#nameA"));fitName($("#nameB"));
    const active=rosterIds.length-hiddenSet.size;
    const remain=Math.max(0,estimate(active)-manual);
    const pct=Math.min(99,Math.round(manual/Math.max(1,manual+remain)*100));
    $("#barFill").style.width=pct+"%";
    $("#progText").textContent=manual+1;
    $("#leftText").textContent=mins(remain);
    $("#undo").style.opacity=history.length?1:.35;
    return;
  }
}

$("#skipA").onclick=()=>hideAct("a");

let RESULT=[],depth="all";
function rankRows(){
  const rows=[];let r=1;
  RESULT.forEach(g=>{
    const keep=g.filter(id=>!hiddenSet.has(id));
    if(!keep.length)return;
    keep.forEach(id=>rows.push({rank:r,act:ACTS[id],unknown:false}));
    r+=keep.length;
  });
  /* 「分からない」で省いた組は、全員そろって最下位に */
  const unknowns=[];
  RESULT.forEach(g=>g.forEach(id=>{if(hiddenSet.has(id))unknowns.push(id)}));
  unknowns.forEach(id=>rows.push({rank:r,act:ACTS[id],unknown:true}));
  return rows;
}
function limited(){const rows=rankRows();return depth==="all"?rows:rows.filter(r=>r.rank<=Number(depth))}
async function showResult(res){
  RESULT=res;
  const n=rankRows().length;
  if(n<1){
    $("#battle").classList.add("hidden");$("#setup").classList.remove("hidden");

  const opts=[["10","上位10位"],["20","上位20位"],["all","全"+n+"組"]].filter(o=>o[0]==="all"||Number(o[0])<n);

    b.setAttribute("aria-pressed",v===depth);
    b.onclick=()=>{depth=v;[...d.children].forEach((c,i)=>c.setAttribute("aria-pressed",opts[i][0]===v));drawResult()};
    d.appendChild(b)});

}
function drawResult(){
  const list=$("#rankList");list.innerHTML="";

const W=1080;let lastBlob=null,drawSeq=0,lastDraw=Promise.resolve();
async function ensureFonts(text){
  try{
    await Promise.all([
      document.fonts.load('700 60px "Zen Kaku Gothic New"',text),
      document.fonts.load('700 30px "Zen Kaku Gothic New"',text),
      document.fonts.load('500 26px "Zen Kaku Gothic New"',text),
      document.fonts.load('400 24px "Zen Kaku Gothic New"',text),
      document.fonts.load('500 56px "Oswald"',"0123456789")
    ]);
    await document.fonts.ready;
  }catch(e){}
}
function fits(ctx,t,size,max){ctx.font=`700 ${size}px "Zen Kaku Gothic New",sans-serif`;return ctx.measureText(t).width<=max}
function splitTwo(ctx,t,size,max){
  /* 2行に割るとき、なるべく行の長さが揃う位置で折る */
  let best=null;
  for(let i=1;i<t.length;i++){
    const a=t.slice(0,i),b=t.slice(i);
    ctx.font=`700 ${size}px "Zen Kaku Gothic New",sans-serif`;
    const wa=ctx.measureText(a).width,wb=ctx.measureText(b).width;
    if(wa>max||wb>max)continue;
    const score=Math.abs(wa-wb);
    if(!best||score<best.score)best={score,lines:[a,b]};
  }
  return best?best.lines:[t];
}
function drawImage(){lastDraw=renderImage();return lastDraw}
async function renderImage(){
  const my=++drawSeq;
  const rows=limited();
  const title=($("#title2").value.trim())||DEFAULT_TITLE;
  await ensureFonts(title+rows.map(r=>r.act.n).join("")+usedLabel+usedTheater+"渋谷よしもと漫才劇場大阪位組年月日を並べかえマンゲキランキングメーカー非公式");
  const c=document.createElement("canvas"),ctx=c.getContext("2d");
  const maxW=W-140;

  /* 見出し：1行に収まる最大サイズを探し、無理なら2行で均等に割る */
  let tSize=52,tLines=null;
  for(;tSize>=32;tSize-=2){if(fits(ctx,title,tSize,maxW)){tLines=[title];break}}
  if(!tLines){tSize=42;tLines=splitTwo(ctx,title,tSize,maxW)}
  const lineH=Math.round(tSize*1.26);
  const headTop=34,subGap=12,subSize=21,headBottom=26;
  const headH=headTop+tLines.length*lineH+subGap+subSize+headBottom;

  const rowH=i=>i===0?96:i<3?78:66;
  let bodyH=0;rows.forEach((r,i)=>bodyH+=rowH(i));
  const footH=96;
  const H=headH+bodyH+footH;
  c.width=W;c.height=H;

  ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1746C8";ctx.fillRect(0,0,W,headH);

  ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillStyle="#FFFFFF";
  tLines.forEach((l,i)=>{
    ctx.font=`700 ${tSize}px "Zen Kaku Gothic New",sans-serif`;
    ctx.fillText(l,W/2,headTop+i*lineH+Math.round((lineH-tSize)/2));
  });
  ctx.font=`500 ${subSize}px "Zen Kaku Gothic New",sans-serif`;
  ctx.fillStyle="rgba(255,255,255,.85)";
  ctx.fillText(`${usedTheater} ${usedLabel} を並べかえ`,W/2,headTop+tLines.length*lineH+subGap);

  ctx.textBaseline="middle";
  let y=headH;
  rows.forEach((r,i)=>{
    const h=rowH(i),cy=y+h/2;
    if(i===0){ctx.fillStyle="#EFF5FF";ctx.fillRect(0,y,W,h)}
    ctx.textAlign="right";
    ctx.font=`500 ${i===0?60:i<3?48:38}px "Oswald",sans-serif`;
    ctx.fillStyle=r.unknown?"#C3CEDE":r.rank===1?"#1746C8":r.rank<=3?"#5B9BFF":"#93A4BE";
    ctx.fillText(String(r.rank),170,cy+2);
    ctx.textAlign="left";
    let ns=i===0?50:i<3?42:34;
    const avail=W-206-56;
    while(ns>20){ctx.font=`700 ${ns}px "Zen Kaku Gothic New",sans-serif`;if(ctx.measureText(r.act.n).width<=avail)break;ns-=2}
    ctx.fillStyle=r.unknown?"#8E9FB8":"#0E2140";
    ctx.fillText(r.act.n,206,cy);
    ctx.fillStyle="#E2EAF6";ctx.fillRect(64,y+h-1,W-128,1);
    y+=h;
  });

  ctx.textAlign="center";
  ctx.font='500 21px "Zen Kaku Gothic New",sans-serif';
  ctx.fillStyle="#93A4BE";
  const d=new Date();
  ctx.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}　マンゲキランキングメーカー（非公式）`,W/2,H-footH/2-4);
  ctx.fillStyle="#1746C8";ctx.fillRect(0,H-8,W*.55,8);
  ctx.fillStyle="#5B9BFF";ctx.fillRect(W*.55,H-8,W*.45,8);

  if(my!==drawSeq)return;
  await new Promise(res=>c.toBlob(b=>{if(my===drawSeq)lastBlob=b;res()},"image/png"));
}

/* ===== 保存・共有 ===== */
let downloads=null;
(async()=>{
  for(let i=0;i<20;i++){if(window.claude&&window.claude.use)break;await new Promise(r=>setTimeout(r,300))}
  try{if(window.claude&&window.claude.use)downloads=await window.claude.use("downloads")}catch(e){}
})();
async function savePng(silent){
  await lastDraw;
  if(!lastBlob)await drawImage();
  const name=($("#title2").value.trim()||"ranking").replace(/[\\/:*?"<>|]/g,"_");
  if(!downloads){
    try{
      const u=URL.createObjectURL(lastBlob);
      const a=document.createElement("a");a.href=u;a.download=name+".png";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
      if(!silent)toast("画像を保存しました");
    }catch(e){toast("画像を保存できませんでした")}
    return;
  }
  try{
    const r=await downloads.save({filename:name+".png",data:lastBlob});
    if(r.status==="saved"&&!silent)toast("保存しました");
  }catch(e){
    if(e&&e.code==="declined")return;
    toast("保存できませんでした。画像を長押しでも保存できます");
  }
}
$("#savePng").onclick=()=>savePng(false);
function shareText(){
  const rows=rankRows().slice(0,10);
  const t=$("#title2").value.trim()||DEFAULT_TITLE;
  return `【${t}】\n`+rows.map(r=>`${r.rank}位 ${r.act.n}`).join("\n")+"\n\n#MNGKSORT";
}
$("#shareX").onclick=()=>{
  const u="https://x.com/intent/post?text="+encodeURIComponent(shareText())+"&url="+encodeURIComponent(shareUrl());
  const w=window.open(u,"_blank","noopener");
  if(!w)toast("ポップアップがブロックされました。文章をコピーしてください");
  savePng(true);
  if(w)toast("画像を保存したら、Xの投稿画面で添付してください");
};
$("#copyTxt").onclick=async()=>{
  const txt=shareText()+"\n"+shareUrl();
  try{await navigator.clipboard.writeText(txt);toast("コピーしました")}
  catch(e){
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("コピーしました")}catch(_){toast("コピーできませんでした")}
    ta.remove();
  }
};
$("#again").onclick=()=>{$("#result").classList.add("hidden");$("#setup").classList.remove("hidden");window.scrollTo(0,0)};

buildPicker();syncAll();
</script>
